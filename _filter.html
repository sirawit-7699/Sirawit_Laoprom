<form class="card card-soft filter-bar mb-4" method="get">{% for key, val in request.args.items(multi=True) %}{% if key not in ['date', 'page'] %}<input type="hidden" name="{{ key }}" value="{{ val }}">{% endif %}{% endfor %}<div><label class="form-label" for="date">เลือกวันที่ (เวลาไทย)</label><input class="form-control" id="date" type="date" name="date" value="{{ selected_date }}"></div><button class="btn btn-primary" type="submit">แสดงข้อมูล</button><a class="btn btn-outline-secondary" href="{{ request.path }}">ล้างตัวกรอง</a></form>{% if filter_error %}<div class="alert alert-warning">{{ filter_error }}</div>{% endif %}
